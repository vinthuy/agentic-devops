# 复制到 AGENTDEV_HOME（默认 ~/.agentdev）下使用
repos:
  acme/web-app:
    local_path: D:/code/web-app          # 已克隆到本地的仓库，必须是 git 仓库
    default_branch: main
    remote: origin                       # 推送目标；仅在 delivery.enabled=true 时使用
    verify_commands:                     # 按顺序执行，任一失败即视为未通过
      lint: "npm run lint"
      test: "npm test -- --ci"
    allowed_commands:                    # Agent 可额外执行的命令前缀
      - "npm run"
    sensitive_paths:                     # 禁止写入；同时命中分级规则时至少为 M 级
      - ".github/workflows/**"
      - "package.json"
      - "src/auth/**"
    verify_config_files:                 # 修改这些文件会触发防作弊检查
      - "jest.config.*"
      - ".eslintrc*"
    budget_usd: 2.0                      # 单任务预算上限（美元），超出即熔断进入 NEEDS_HUMAN
